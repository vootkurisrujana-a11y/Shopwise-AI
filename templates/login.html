{% extends 'base.html' %}

{% block content %}
<div class="glass-panel auth-container">
    <div style="text-align: center; margin-bottom: 2rem;">
        <i class="fas fa-user-lock" style="font-size: 2.5rem; background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
        <h2 style="margin-top: 0.75rem;">Account Login</h2>
        <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.25rem;">Log in to track query history and save item alerts.</p>
    </div>

    {% if error %}
        <div class="error-message-box">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-form">Sign In</button>
    </form>

    <div class="form-footer-text">
        Don't have an account? <a href="{{ url_for('register') }}">Create one here</a>
    </div>

    <!-- One-click Demo Login Credentials -->
    <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
        <button type="button" class="btn-card primary" style="width: 100%; padding: 0.65rem;" onclick="demoLogin('user', 'user123')">
            <i class="fas fa-user"></i> One-click Login (Demo User)
        </button>
        <button type="button" class="btn-card outline" style="width: 100%; padding: 0.65rem; border-color: var(--accent); color: white;" onclick="demoLogin('admin', 'admin123')">
            <i class="fas fa-user-shield" style="color: var(--accent);"></i> One-click Login (Demo Admin)
        </button>
    </div>
</div>

<script>
    function demoLogin(username, password) {
        document.getElementById('username').value = username;
        document.getElementById('password').value = password;
        document.querySelector('form').submit();
    }
</script>
{% endblock %}
